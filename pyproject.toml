[project]
name = "freshpointapi"
version = "0.1.0"
description = "Read-only HTTP API over FreshPoint location and product data."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konstantin Mykhailov" }]
dependencies = [
    "freshpointclient",
    "freshpointparser",
    "aiohttp>=3.10.11",
    "fastapi>=0.124.4",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/freshpointapi"]

[tool.uv]
package = true

[tool.uv.sources]
freshpointclient = { path = "../FreshPointClient", editable = true }
freshpointparser = { path = "../FreshPointParser", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.14.1",
]
